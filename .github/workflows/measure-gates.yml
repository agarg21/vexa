# fork-only probe: core/agent alone, serial with --durations, then pytest-xdist -n 4 (dispatch only)
name: measure-gates

on:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: nproc; uv sync --frozen
        working-directory: core/agent
      - name: serial with durations
        working-directory: core/agent
        run: uv run pytest -q --durations=40 -o faulthandler_timeout=300
        continue-on-error: true
      - name: xdist -n 4
        working-directory: core/agent
        run: uv run --with pytest-xdist pytest -q -n 4 -o faulthandler_timeout=300
        continue-on-error: true
    timeout-minutes: 75
