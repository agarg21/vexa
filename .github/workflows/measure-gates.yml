# fork-only probe 2: core/agent with pytest-xdist -n 4, fixed hash seed (probe 1 failed: different param order per worker)
name: measure-gates

on:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: xdist -n 4 (PYTHONHASHSEED=0)
        working-directory: core/agent
        env: { PYTHONHASHSEED: "0" }
        run: uv run --with pytest-xdist pytest -q -n 4 --durations=15 -o faulthandler_timeout=300
    timeout-minutes: 60
